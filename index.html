#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-size:34px;font-weight:900;text-align:center;pointer-events:none;opacity:0;text-shadow:0 3px 14px #000,0 0 22px #ff5fa2;white-space:nowrap}
#toast.show{animation:pop 3s forwards}

#air a{color:#8bb4ff;margin-left:6px;font-weight:600}
