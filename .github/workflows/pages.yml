name: Deploy to GitHub Pages

# Publishes the site whenever main changes. The coin address comes from the
# repository variable CA_KEY (Settings > Secrets and variables > Actions > Variables).
# If CA_KEY is not set, the ca in config.js is used.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node tests/run-tests.js
      - name: Build site
        run: node scripts/build.js dist
        env:
          CA_KEY: ${{ vars.CA_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
